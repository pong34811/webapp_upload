services:
  - type: web
    name: webapp-upload
    runtime: python
    buildCommand: |
      cd backend && pip install -r requirements.txt
      python manage.py migrate --noinput
    startCommand: cd backend && python manage.py ensure_admin && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        value: "admin@example.com"

  - type: static_site
    name: webapp-upload-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://webapp-upload.onrender.com
